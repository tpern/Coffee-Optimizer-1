<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Coffee Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            slate: { 850: '#172033' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans antialiased">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200/80 overflow-hidden">
      <div class="px-8 pt-10 pb-2">
        <div class="flex justify-center mb-2">
          <span class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-primary-100 text-primary-600 text-2xl">☕</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 text-center tracking-tight">Admin Login</h1>
        <p class="text-slate-500 text-center text-sm mt-1.5">Coffee Optimizer Admin Panel</p>
      </div>

      <form id="loginForm" class="px-8 pb-10 pt-6">
        <div class="space-y-5">
          <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              placeholder="Enter your username"
              class="form-input-admin w-full px-4 py-3 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
              class="form-input-admin w-full px-4 py-3 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
            />
          </div>

          <div class="flex items-center">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
              class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500"
            />
            <label for="rememberMe" class="ml-2 text-sm text-slate-600">Remember me</label>
          </div>
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="mt-6 w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-lg bg-primary-600 text-white font-semibold text-sm shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          <span id="loginBtnText">Log In</span>
          <span id="loginBtnSpinner" class="spinner" style="display:none;"></span>
        </button>

        <div id="errorMessage" class="error-message mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm" style="display:none;"></div>
      </form>
    </div>

    <p class="text-center text-slate-500 text-sm mt-8">© 2024 Coffee Optimizer</p>
  </div>

  <script src="/js/admin-auth.js"></script>
</body>
</html>
