<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Coffee Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            sidebar: { DEFAULT: '#0f172a', light: '#1e293b', hover: '#334155' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 font-sans antialiased text-slate-800">
  <div class="dashboard-container flex min-h-screen">
    <!-- Sidebar: on mobile hidden off-screen, toggled by sidebarToggle -->
    <aside id="sidebar" class="sidebar w-64 min-h-screen bg-sidebar flex-shrink-0 fixed left-0 top-0 z-30 flex flex-col border-r border-slate-700/50 md:translate-x-0 transform -translate-x-full md:transform-none transition-transform duration-200 ease-out">
      <div class="p-6 border-b border-slate-700/50">
        <div class="flex items-center gap-3">
          <span class="flex items-center justify-center w-10 h-10 rounded-lg bg-primary-600/20 text-primary-400 text-lg">☕</span>
          <div>
            <h2 class="font-semibold text-white text-base tracking-tight">Coffee Optimizer</h2>
            <p class="text-slate-400 text-xs">Admin Panel</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto py-4 px-3">
        <ul class="sidebar-nav space-y-0.5">
          <li>
            <a href="#" data-page="dashboard" class="sidebar-nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-sidebar-hover hover:text-white transition-colors text-sm font-medium">
              <span class="text-lg opacity-90">📊</span>
              Dashboard
            </a>
          </li>
          <li>
            <a href="#" data-page="contacts" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-sidebar-hover hover:text-white transition-colors text-sm font-medium">
              <span class="text-lg opacity-90">📧</span>
              Contact Messages
            </a>
          </li>
          <li>
            <a href="#" data-page="reviews" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-sidebar-hover hover:text-white transition-colors text-sm font-medium">
              <span class="text-lg opacity-90">⭐</span>
              Reviews
            </a>
          </li>
          <li>
            <a href="#" data-page="sca-feedback" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-sidebar-hover hover:text-white transition-colors text-sm font-medium">
              <span class="text-lg opacity-90">📝</span>
              SCA Feedback
            </a>
          </li>
          <li>
            <a href="#" data-page="brew-reviews" class="sidebar-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-sidebar-hover hover:text-white transition-colors text-sm font-medium">
              <span class="text-lg opacity-90">☕</span>
              Brew Reviews
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Backdrop for mobile sidebar -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/50 z-20 opacity-0 pointer-events-none md:pointer-events-none md:opacity-0 transition-opacity duration-200" aria-hidden="true"></div>

    <!-- Main content -->
    <main class="main-content flex-1 md:ml-64 min-h-screen flex flex-col">
      <header class="dashboard-header flex items-center justify-between gap-4 px-4 sm:px-8 py-4 sm:py-6 bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="flex items-center gap-3">
          <button type="button" id="sidebarToggle" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-primary-500" aria-label="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="pageTitle" class="text-xl font-bold text-slate-800 m-0">Dashboard</h1>
        </div>
        <button type="button" id="logoutBtn" class="logout-btn inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-red-600 text-white text-sm font-semibold hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
          Logout
        </button>
      </header>

      <div class="flex-1 p-4 sm:p-6 lg:p-8">
        <!-- Dashboard Content -->
        <div id="dashboardContent">
          <div id="statsContainer" class="stats-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8"></div>
          <div id="chartsContainer" class="charts-container grid grid-cols-1 xl:grid-cols-2 gap-6"></div>
        </div>

        <!-- Contact Messages (hidden by default) -->
        <div id="contactsContent" class="hidden"></div>

        <!-- Reviews (hidden by default) -->
        <div id="reviewsContent" class="hidden"></div>

        <!-- SCA Feedback (hidden by default) -->
        <div id="scaContent" class="hidden"></div>

        <!-- Brew Reviews (hidden by default) -->
        <div id="brewReviewsContent" class="hidden"></div>
      </div>
    </main>
  </div>

  <script src="/js/admin-auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
